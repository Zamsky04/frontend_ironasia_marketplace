<div class="single-categories p-5 m-2 flex flex-col">
  
  <div>
    <a >
      <img [src]="item.dmplimage" alt="Image" />
    </a>
    <h3>
      <a >
        {{ item.dmplname }}
      </a>
    </h3>
  </div>

  <div class="mt-auto pt-4 flex items-center justify-between">
    
    <span>{{ item.dmplct }} Products</span>

    <a
      [routerLink]="['/find']"
      [queryParams]="{ prodid: item.dmplcode, prodname: item.dmplname, prodimg: item.dmplimage }"
      class="read-now inline-block cursor-pointer
             bg-transparent border border-blue-500 text-blue-500 font-medium text-sm py-2 px-4 rounded-md shadow-sm hover:bg-blue-500 hover:text-white"
      target="_blank"
    >
      Details
    </a>
  </div>
</div>
