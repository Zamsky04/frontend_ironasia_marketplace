<div
  class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
>
  <div
    *ngFor="let product of products"
    class="border border-gray-300 bg-white p-4 h-full flex flex-col justify-between hover:border-[var(--primaryColor)] transition duration-200"
  >
    <!-- Product Image -->
    <div class="flex justify-center items-center mb-3 h-40 bg-gray-50">
      <img
        [src]="product.images?.[0]?.itemImageSrc || fallbackImage"
        [alt]="product.dctwProductName || 'Product'"
        class="max-h-full max-w-full object-contain"
      />
    </div>

    <!-- Product Info -->
    <div
      class="flex flex-col border-t pt-3 border-gray-200 font-[var(--fontFamily)] text-gray-800"
    >
      <a
        href="#"
        class="text-sm font-medium title-card mb-2 hover:text-[var(--primaryColor)] transition"
        pTooltip="{{ product.dctwProductTypeSpec }}"
        tooltipPosition="top"
      >
        {{ product.dctwProductTypeSpec }}
      </a>

      <div class="flex flex-row justify-start gap-3 text-sm text-gray-700 mb-2">
        <div class="flex items-center">
          <i
            pTooltip="Stock"
            tooltipPosition="top"
            class="pi pi-box mr-1 text-sm"
          ></i>
          {{ product.dctwProducttypeStockQty }}
        </div>
        <div class="flex items-center">
          <i
            pTooltip="Minimum Purchase"
            tooltipPosition="top"
            class="pi pi-info-circle mr-1 text-sm"
          ></i>
          {{ product.dctwProducttypeMinQty }}
        </div>
      </div>

      <div class="flex items-center text-xs text-gray-500 min-h-[1.5rem] mb-2">
        <i
          class="pi pi-map-marker mr-1"
          pTooltip="Location"
          tooltipPosition="top"
        ></i>
        {{ product.dctwProvince }}
      </div>

      <div
        class="product-price text-sm font-semibold text-[var(--primaryColor)] mb-2"
      >
        {{ product.dctwProducttypePrice | currency : "IDR " : "symbol" }}
      </div>

     
      
       <button
                pButton
                pRipple
                type="button"
                label="Shop Now"
                icon="pi pi-shopping-cart"
                iconPos="right"
                (click)="onShopNow(product)"
                class="p-button-sm w-full"
                 pTooltip="Belanja Sekarang"
                tooltipPosition="top"   

        tooltipPosition="top"

                styleClass="bg-primary-500 hover:bg-primary-600 border-primary-500 hover:border-primary-600 text-white transition-colors duration-150 flex justify-center items-center"
              ></button>
    </div>
  </div>
</div>
