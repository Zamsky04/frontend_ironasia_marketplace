<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
  <div
    *ngFor="let product of products; trackBy: trackByProductId"
    class="border border-gray-300 bg-white p-4 h-full flex flex-col hover:border-[var(--primaryColor)] transition duration-200"
  >
    <!-- Gambar Produk -->
    <div class="flex justify-center items-center mb-3 h-40 bg-gray-50">
      <img
        [src]="product.images?.[0]?.itemImageSrc || fallbackImage"
        [alt]="product.dctwProductName || product.dctwProductTypeSpec || 'Product'"
        class="max-h-full max-w-full object-contain"
        loading="lazy"
      />
    </div>

    <!-- Info Produk -->
    <div class="mt-auto pt-3 border-t border-gray-200 font-[var(--fontFamily)] text-gray-800">
      <a
        class="text-sm font-medium title-card mb-2 inline-block hover:text-[var(--primaryColor)] transition"
        [pTooltip]="product.dctwProductTypeSpec || ''"
        tooltipPosition="top"
        href="javascript:void(0)"
        [attr.aria-label]="product.dctwProductTypeSpec || 'Product detail'"
      >
        {{ product.dctwProductTypeSpec }}
      </a>

      <div class="flex flex-row justify-start gap-3 text-sm text-gray-700 mb-2">
        <div class="flex items-center">
          <i class="pi pi-box mr-1 text-sm" [pTooltip]="'Stock'" tooltipPosition="top"></i>
          {{ product.dctwProducttypeStockQty }}
        </div>
        <div class="flex items-center">
          <i class="pi pi-info-circle mr-1 text-sm" [pTooltip]="'Minimum Purchase'" tooltipPosition="top"></i>
          {{ product.dctwProducttypeMinQty }}
        </div>
      </div>

      <div class="flex items-center text-xs text-gray-500 min-h-[1.5rem] mb-2">
        <i class="pi pi-map-marker mr-1" [pTooltip]="'Location'" tooltipPosition="top"></i>
        <span class="truncate">{{ product.dctwProvince }}</span>
      </div>

      <div class="product-price text-sm font-semibold text-[var(--primaryColor)] mb-3">
        {{ product.dctwProducttypePrice | currency:'IDR':'symbol':'1.0-0' }}
      </div>

      <button
        pButton
        pRipple
        type="button"
        label="Shop Now"
        icon="pi pi-shopping-cart"
        iconPos="right"
        class="p-button-sm w-full btn-shop"
        [pTooltip]="'Belanja Sekarang'"
        tooltipPosition="top"
        (click)="onShopNow(product)"
      ></button>
    </div>
  </div>
</div>
