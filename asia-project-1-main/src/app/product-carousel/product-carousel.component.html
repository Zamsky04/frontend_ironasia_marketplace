<div class="py-4 md:py-6 px-2 bg-slate-50 mb-6">
  <div class="mb-6 flex flex-col sm:flex-row justify-between sm:items-center px-2">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">{{ title }}</h2>
      <h5 class="text-sm text-slate-600 mt-px max-w-xl">{{ desc }}</h5>
    </div>

    <a href="#" (click)="onViewMoreClick($event)"
       class="text-sm text-indigo-600 hover:text-indigo-700 font-medium no-underline transition-colors duration-150 flex items-center group">
      View More
      <i class="pi pi-arrow-right ml-1 transform transition-transform duration-150 group-hover:translate-x-1"></i>
    </a>
  </div>

  <p-carousel
    styleClass="product-carousel"
    [value]="products"
    [numVisible]="numVisible"
    [numScroll]="1"
    [circular]="false"
    [showIndicators]="showIndicators"
    [showNavigators]="showNavigators"
    [responsiveOptions]="responsiveOptions"
  >
    <ng-template let-product pTemplate="item">
      <div class="product-card-wrapper p-2">
        <div class="product-card bg-white rounded-xl border border-slate-200 hover:border-indigo-500 shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden flex flex-col h-full">

          <div class="product-image">
            <img
              [src]="product?.images?.[0]?.itemImageSrc || 'assets/placeholder.png'"
              [alt]="product?.dctwProductName || 'Product'"
            />
          </div>

          <div class="product-content">
            <a class="title-card" [title]="product?.dctwProductTypeSpec">
              {{ product?.dctwProductTypeSpec }}
            </a>

            <div class="meta-line">
              <div class="pair" pTooltip="Stock Available">
                <i class="pi pi-box"></i><span>{{ product?.dctwProducttypeStockQty }}</span>
              </div>
              <div class="pair" pTooltip="Minimum Purchase">
                <i class="pi pi-info-circle"></i><span>{{ product?.dctwProducttypeMinQty }}</span>
              </div>
            </div>

            <div class="location">
              <i class="pi pi-map-marker"></i>
              <span class="truncate" [title]="product?.dctwProvince">{{ product?.dctwProvince }}</span>
            </div>

            <div class="cta">
              <span class="product-price">
                {{ product?.dctwProducttypePrice | currency : 'IDR ' : 'symbol' : '1.0-0' }}
              </span>
              <button
                pButton
                pRipple
                type="button"
                label="Shop Now"
                icon="pi pi-shopping-cart"
                iconPos="right"
                (click)="openDrawer(product)"
                class="p-button-sm w-full"
                pTooltip="Belanja Sekarang"
                tooltipPosition="top"
                [style]="{ 'background-color': '#0056d6', border: 'none' }"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-carousel>
</div>
