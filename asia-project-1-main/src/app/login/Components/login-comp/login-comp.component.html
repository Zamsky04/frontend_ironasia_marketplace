<div data-dialog-backdrop-close="true" class="flex items-center justify-center bg-gradient-to-br from-purple-50 to-indigo-100 py-6">
  <div class="w-full max-w-[280px] p-4 space-y-3 bg-white rounded-lg shadow-md">
    <div class="flex justify-center">
      <img src="/img/logo.png" alt="Logo Perusahaan" class="h-20 w-auto">
      </div>

    <div class="text-center space-y-1">
      <h2 class="text-lg sm:text-xl font-bold text-gray-900">
        User Login
      </h2>
      <p class="text-xs text-gray-600">
        Welcome
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-medium text-gray-700 mb-0.5">
          Email Address
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none">
            <svg class="h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path d="M3 4a2 2 0 012-2h10a2 2 0 012 2v1.172l-7 4.667-7-4.667V4z" />
              <path fill-rule="evenodd" d="M2 6.828V16a2 2 0 002 2h12a2 2 0 002-2V6.828l-8 5.333-8-5.333z" clip-rule="evenodd" />
            </svg>
          </span>
          <input
            id="email"
            formControlName="email" type="email"
            autocomplete="email"
            required
            class="block w-full pl-7 pr-2 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-transparent sm:text-xs transition duration-150 ease-in-out"
            placeholder="anda@email.com"
            >
            </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-0.5">
          <label for="password" class="block text-xs font-medium text-gray-700">
            Password
          </label>
          <div class="text-xs">
          <!--  <a href="javascript:void(0)" (click)="openForgotPasswordDialog($event)" class="font-medium text-purple-600 hover:text-purple-500 transition duration-150 ease-in-out">
    Lupa password?
  </a>--> 
    <a [routerLink]="['/forgotpass']" target="_blank" class="font-medium text-purple-600 hover:text-purple-500 transition duration-150 ease-in-out">
                    forgot password
                  </a>
          </div>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-2 pointer-events-none">
            <svg class="h-4 w-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
            </svg>
          </span>
          <input
            id="password"
            formControlName="password"
            autocomplete="current-password"
             [type]="passwordVisible ? 'text' : 'password'"
            required
            class="block w-full pl-7 pr-2 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-purple-500 focus:border-transparent sm:text-xs transition duration-150 ease-in-out"
            placeholder="••••••••"
            >
            <button type="button" (click)="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
              <!-- Ikon Mata Terbuka -->
              <svg *ngIf="!passwordVisible" class="h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.022 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
              <!-- Ikon Mata Tertutup (dicoret) -->
              <svg *ngIf="passwordVisible" class="h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.955 9.955 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd" />
                <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.303 3.707a1 1 0 011.414-1.414l14 14a1 1 0 01-1.414 1.414l-4.26-4.26z" />
              </svg>
            </button>
            </div>
      </div>

  <!--  <div class="flex items-center justify-start">
        <div class="flex items-center h-4">
            <input
            id="remember-me"
            name="remember-me" type="checkbox"
            class="h-3 w-3 text-purple-600 border-gray-300 rounded focus:ring-purple-500 transition duration-150 ease-in-out cursor-pointer"
            >
            </div>
        <div class="ml-2 text-xs">
          <label for="remember-me" class="font-medium text-gray-700 cursor-pointer">
            Ingat saya
          </label>
        </div>
      </div>-->
<div *ngIf="errorMessage" class="p-2 my-2 bg-red-100 text-red-700 text-xs rounded-md text-center">
  {{ errorMessage }}
</div>
      <div>
        <button
          type="submit"
          [disabled]="loginForm.invalid" class="w-full flex justify-center py-2 px-3 border border-transparent rounded-md shadow-sm text-xs font-medium text-white bg-green-600 hover:bg-blue-700 focus:outline-none focus:ring-1 focus:ring-offset-1 focus:ring-purple-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
          >
          Sign In
        </button>
      </div>
       <div>
        <button class="w-full flex justify-center py-2 px-3 border border-transparent rounded-md shadow-sm text-xs font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-1 focus:ring-offset-1 focus:ring-purple-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="closeForm()">
          Home
        </button>
      </div>
    </form>

    <div class="text-xs text-center text-gray-600 pt-3 border-t border-gray-200">
      New to Iron Asia ?
       <a href="javascript:void(0)" (click)="openRegistrationDialog($event)" class="font-medium text-purple-600 hover:text-purple-500 transition duration-150 ease-in-out">
    Create an account
  </a>
    </div>

  </div>
</div>
