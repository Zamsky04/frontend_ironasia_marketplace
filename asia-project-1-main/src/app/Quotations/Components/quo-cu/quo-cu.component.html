<div class="h-full w-full p-4 md:p-6 bg-gray-50">
    <div class="bg-white p-6 md:p-8 rounded-lg shadow-xl max-w-4xl mx-auto">

        <div class="flex items-center justify-center space-x-3 sm:space-x-4 mb-8">
            <img src="/assets/ialogo_awal.png" alt="Logo Perusahaan" class="h-10 sm:h-12 w-auto">
            <h1 class="text-2xl lg:text-3xl font-bold text-blue-700">
                Request For Quotation - Manual
            </h1>
        </div>
        <div>
        <span *ngIf="p_status === 'RQ'">
                    <div class="bg-white rounded-lg shadow-md p-4 mt-4">
                        <h3 class="text-lg font-medium text-gray-900 mb-2">Reject Note</h3>
                        <p class="text-gray-700">{{p_reason || 'No notes available.'}}</p>
                    </div>
       </span>
       </div>
        <form [formGroup]="forms" class="space-y-6">

            <div class="flex flex-col md:flex-row md:space-x-4 space-y-6 md:space-y-0">
                <div class="flex-grow">
                    <label for="ctqhProductName" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                    <input type="text" id="ctqhProductName" name="ctqhProductName" formControlName="ctqhProductName"
                        class="shadow-sm appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400"
                        placeholder="Masukkan Nama Product" />
                </div>
            </div>
              <div *ngIf="forms.get('ctqhProductName')?.invalid && (forms.get('ctqhProductName')?.touched || forms.get('ctqhProductName')?.dirty)" 
                    class="text-red-600 text-sm mt-1">
                    <div *ngIf="forms.get('ctqhProductName')?.errors?.['required']">
                        Subject cannot be empty.
                    </div>
                </div>

          <!--  <div>
                <label for="ctqhNotes" class="block text-sm font-medium text-gray-700 mb-1">Subject Detail</label>
                <textarea id="ctqhNotes" formControlName="ctqhNotes" name="ctqhNotes" rows="8"
                    class="shadow-sm appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400"
                    placeholder="Masukkan detail spesifikasi, catatan, atau instruksi tambahan di sini..."
                    style="min-height: 250px;"></textarea>
            </div>-->

            <div>
    <label for="ctqhNotes" class="block text-sm font-medium text-gray-700 mb-1">Subject Detail</label>
    <textarea id="ctqhNotes" formControlName="ctqhNotes" name="ctqhNotes" rows="8"
        class="shadow-sm appearance-none border border-gray-300 rounded-md w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400"
        placeholder="Masukkan detail spesifikasi, catatan, atau instruksi tambahan di sini..."
        style="min-height: 250px;"
        
        [ngClass]="{ 'border-red-500 focus:ring-red-500': forms.get('ctqhNotes')?.invalid && forms.get('ctqhNotes')?.touched }">
    </textarea>
    
    <div *ngIf="forms.get('ctqhNotes')?.invalid && (forms.get('ctqhNotes')?.touched || forms.get('ctqhNotes')?.dirty)" 
         class="text-red-600 text-sm mt-1">
        <div *ngIf="forms.get('ctqhNotes')?.errors?.['required']">
            Subject Detail cannot be empty.
        </div>
    </div>
</div>

            <div
                class="flex flex-col md:grid md:grid-cols-[1fr_auto] md:gap-4 md:items-start pt-8 space-y-6 md:space-y-0">

                 <div class="flex items-start space-x-2 md:space-x-4">
                    @if (p_type === 'Insert') {
                        <!-- Tampilan interaktif untuk mode INSERT -->
                        <div class="flex flex-col">
                            <div *ngIf="!imagePreview1" (click)="imageInput1.click()" tabindex="0"
                                (keydown.enter)="$event.preventDefault(); imageInput1.click()"
                                (keydown.space)="$event.preventDefault(); imageInput1.click()"
                                class="w-20 h-20 border-2 border-dashed border-gray-300 rounded flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:border-gray-400 cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                                title="Upload Gambar 1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </div>
                            <img *ngIf="imagePreview1" [src]="imagePreview1" alt="Preview Image 1"
                                class="w-20 h-20 object-cover rounded border border-gray-200 shadow-sm cursor-pointer hover:opacity-80"
                                title="Klik untuk mengganti Gambar 1" (click)="imageInput1.click()" />
                            <input #imageInput1 type="file" (change)="onFileSelected1($event)" accept="image/*"
                                class="hidden" />
                        </div>
                    } @else {
                        <!-- Tampilan statis (view-only) untuk mode UPDATE/VIEW -->
                        <div class="flex flex-col">
                            <img *ngIf="imagePreview1" [src]="imagePreview1" alt="Uploaded Image 1"
                                class="w-20 h-20 object-cover rounded border border-gray-200 shadow-sm" />
                            <div *ngIf="!imagePreview1"
                                class="w-20 h-20 border-2 border-gray-200 bg-gray-100 rounded flex items-center justify-center text-gray-400 cursor-not-allowed">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L6.228 6.228" />
                                </svg>
                            </div>
                        </div>
                    }
                   
                     @if (p_type === 'Insert') {
                        <!-- Tampilan interaktif untuk mode INSERT -->
                        <div class="flex flex-col">
                            <div *ngIf="!imagePreview2" (click)="imageInput2.click()" tabindex="0"
                                (keydown.enter)="$event.preventDefault(); imageInput2.click()"
                                (keydown.space)="$event.preventDefault(); imageInput2.click()"
                                class="w-20 h-20 border-2 border-dashed border-gray-300 rounded flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:border-gray-400 cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                                title="Upload Gambar 2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                                    stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </div>
                            <img *ngIf="imagePreview2" [src]="imagePreview2" alt="Preview Image 2"
                                class="w-20 h-20 object-cover rounded border border-gray-200 shadow-sm cursor-pointer hover:opacity-80"
                                title="Klik untuk mengganti Gambar 2" (click)="imageInput2.click()" />
                            <input #imageInput2 type="file" (change)="onFileSelected2($event)" accept="image/*"
                                class="hidden" />
                        </div>
                    } @else {
                        <!-- Tampilan statis (view-only) untuk mode UPDATE/VIEW -->
                        <div class="flex flex-col">
                            <img *ngIf="imagePreview2" [src]="imagePreview2" alt="Uploaded Image 2"
                                class="w-20 h-20 object-cover rounded border border-gray-200 shadow-sm" />
                            <div *ngIf="!imagePreview2"
                                class="w-20 h-20 border-2 border-gray-200 bg-gray-100 rounded flex items-center justify-center text-gray-400 cursor-not-allowed">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.243 4.243L6.228 6.228" />
                                </svg>
                            </div>
                        </div>
                    }
                </div>
                <span *ngIf="p_type === 'Insert'">
                    <button (click)="submitRequest()"
                        class="inline-flex items-center justify-center px-3 py-2 sm:px-4 sm:py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition-colors duration-150">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1 sm:mr-2" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path
                                d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 16.571V11a1 1 0 112 0v5.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                        Send Manual Quotation
                    </button>
                </span>

                
            </div>

        </form>
    </div>
</div>
