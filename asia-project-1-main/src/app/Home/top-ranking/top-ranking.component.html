
<div class="my-8 ia-primary-scope">
  <div class="bg-white rounded-xl shadow-lg overflow-hidden">
    <div class="p-4 sm:p-6"> <div class="mb-4 sm:mb-6 flex flex-col sm:flex-row justify-between sm:items-center">
        <div class="mb-3 sm:mb-0">
          <h2 class="text-2xl lg:text-3xl font-bold text-slate-800">
            Top Ranking
          </h2>
          <p class="text-sm text-slate-600 mt-1 max-w-xl">
             Check out the latest additions to our collection. Freshly arrived and ready for you!
          </p>
        </div>

      </div>

      <div>
        <app-product-list-card
          [products]="toprank"
          (shopNowClicked)="openShopDrawer($event)"
        ></app-product-list-card>
      </div>
    </div>
  </div>
</div>

<app-shop-drawer
  [(visible)]="showDrawer"
  [product]="selectedProduct"
  (close)="showDrawer = false"
></app-shop-drawer>
