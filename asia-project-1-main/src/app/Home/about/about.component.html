<div *ngIf="isLoading" class="flex items-center justify-center p-8">
  <i class="pi pi-spin pi-spinner" style="font-size: 2rem"></i>
  <span class="ml-3 text-gray-600">Loading Content...</span>
</div>


<div *ngIf="!isLoading" class="bg-gray-50">

  <div class="flex items-center gap-4 p-5 bg-white border-b border-gray-200">
    <div class="flex-shrink-0 bg-blue-100 p-3 rounded-full">
      <i class="pi pi-building text-2xl text-blue-700"></i>
    </div>

    <div>
      <h2 class="text-xl font-bold text-blue-800">
        About Us
      </h2>
      <p class="text-sm text-blue-600">
        The story and the team behind our success.
      </p>
    </div>
  </div>

  <div class="p-6">
    <div
      [innerHTML]="aboutContent"
      class="prose max-w-none text-gray-700 whitespace-pre-line">
    </div>
  </div>


  <div class="p-4 bg-white border-t border-gray-200">
    <button class="w-full flex justify-center py-2 px-3 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-1 focus:ring-offset-1 focus:ring-purple-500"
      (click)="closeForm()">
      Close
    </button>
  </div>
</div>
