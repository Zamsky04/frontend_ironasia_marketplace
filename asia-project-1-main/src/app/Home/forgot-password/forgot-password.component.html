<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">

  <!-- 2. Letakkan konten form Anda di dalamnya -->
  <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">

    <div class="flex items-center mb-6">
      <img src="/img/logo.png" alt="Recovery Icon" class="h-12 w-12 mr-4"/>
      <h1 class="text-2xl font-bold text-gray-800">
        Recover your account
      </h1>
    </div>

    <p class="text-gray-600 mb-6">
      We can help you reset your password and security info. First, enter your account email and follow the instructions below.
    </p>

    <form>
      <div class="mb-4">
          <label for="email" class="block text-gray-700 text-sm font-bold mb-2">
            Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            name="email"
            #emailInput
            placeholder="Enter your email address"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          />
        </div>

        <div class="flex items-center justify-end gap-4 mt-8">
          <button (click)="closeForm()"
            type="button" 
            class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Cancel
          </button>
          <button 
            type="button" 
            (click)="forgotpass(emailInput.value)"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
            Confirm
          </button>
        </div>
    </form>

  </div>
  
</div>
