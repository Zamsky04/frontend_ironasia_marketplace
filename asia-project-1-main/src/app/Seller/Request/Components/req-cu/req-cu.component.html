<div class="bg-slate-50 font-sans">
  <div class="container mx-auto p-4 sm:p-6 lg:p-8 relative">

    <button 
      (click)="closeDialog()"
      type="button" 
      aria-label="Close"
      class="absolute top-4 right-4 sm:top-6 sm:right-6 z-10 text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors duration-200">
      <mat-icon>close</mat-icon>
    </button>

    <form (ngSubmit)="submitRequest()" #quoteForm="ngForm">
      <div class="text-center mb-8">
          <h1 class="text-3xl font-bold text-gray-800 tracking-tight">E-Commerce Upload Request</h1>
          <p class="mt-2 text-md text-gray-500" *ngIf="p_type === 'Update'">
            Editing Request: <span class="font-semibold text-indigo-600">{{p_reqno}}</span>
          </p>
      </div>

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg space-y-8">
      
      <div>
        <h2 class="text-lg font-semibold text-gray-800 border-b pb-3 mb-6 flex items-center">
          <span class="text-indigo-600 mr-3">1</span> Product Details
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-1">
          <div>
            <label for="selectedprod" class="block text-sm font-medium text-gray-700 mb-1">Product</label>
            <select id="selectedprod" [(ngModel)]="selectedprod" (ngModelChange)="changeproduct()" name="selectedprod" class="w-full p-2.5 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option *ngFor="let prod of prodlist" [ngValue]="prod.cmprCode">{{ prod.cmprName }}</option>
            </select>
          </div>
          <div>
            <label for="selectedprodtype" class="block text-sm font-medium text-gray-700 mb-1">Product Type</label>
            <select id="selectedprodtype" [(ngModel)]="selectedprodtype" (ngModelChange)="changeproducttype()" name="selectedprodtype" class="w-full p-2.5 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
             <option *ngFor="let prodty of prodtylist" [ngValue]="prodty.cmprtCode">{{ prodty.cmprtTypeDesc }}</option>
            </select>
          </div>

          <div class="mt-2">
              <label for="ctecdProductName" class="block text-xs font-medium text-gray-500">Manual Product Name</label>
              <input type="text" id="ctecdProductName" [(ngModel)]="data.ctecdProductName" name="ctecdProductName" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
           <div class="mt-2">
              <label for="prodtypenm" class="block text-xs font-medium text-gray-500">Manual Product Type</label>
              <input type="text" id="prodtypenm" [(ngModel)]="data.ctecdProducttypeName" name="ctecdProducttypeName" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>
          
          <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-1 mt-4">
              <div>
                <label for="ctecdProductTypeAlias" class="block text-sm font-medium text-gray-700 mb-1">Alias</label>
                <input type="text" id="ctecdProductTypeAlias" [(ngModel)]="data.ctecdProductTypeAlias" name="ctecdProductTypeAlias" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <div>
                <label for="ctecdProductTypeSize" class="block text-sm font-medium text-gray-700 mb-1">Size</label>
                <input type="text" id="ctecdProductTypeSize" [(ngModel)]="data.ctecdProductTypeSize" name="ctecdProductTypeSize" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              </div>
          </div>

          <div class="md:col-span-2 mt-4">
              <label for="ctecdProductTypeSpec" class="block text-sm font-medium text-gray-700 mb-1">Specifications</label>
              <input type="text" id="ctecdProductTypeSpec" [(ngModel)]="data.ctecdProductTypeSpec" name="ctecdProductTypeSpec" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>

           <div class="md:col-span-2 mt-4">
              <label for="ctecdProducttypeDesc" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
              <textarea id="ctecdProducttypeDesc" [(ngModel)]="data.ctecdProducttypeDesc" name="ctecdProducttypeDesc" rows="3" class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold text-gray-800 border-b pb-3 mb-6 flex items-center">
              <span class="text-indigo-600 mr-3">2</span> Commercial Details
            </h2>
            <div class="space-y-4">
                <div>
                    <label for="ctecdProducttypePrice" class="block text-sm font-medium text-gray-700">Price</label>
                    <div class="relative mt-1">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"><span class="text-gray-500">IDR</span></div>
                        <input type="number" id="ctecdProducttypePrice" [(ngModel)]="data.ctecdProducttypePrice" name="ctecdProducttypePrice" class="w-full pl-8 p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                      <label for="ctecdProducttypeStockQty" class="block text-sm font-medium text-gray-700">Stock</label>
                      <input type="number" id="ctecdProducttypeStockQty" [(ngModel)]="data.ctecdProducttypeStockQty" name="ctecdProducttypeStockQty" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                      <label for="mipurchase" class="block text-sm font-medium text-gray-700">Min. Purchase</label>
                      <input type="number" id="ctecdProducttypeMinQty" [(ngModel)]="data.ctecdProducttypeMinQty" name="ctecdProducttypeMinQty" class="w-full mt-1 p-2 border border-gray-300 rounded-md shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                </div>
                <div class="flex items-start space-x-8 pt-2">
                    <div class="flex items-center"><mat-checkbox [(ngModel)]="vtop" name="vtop" class="mr-2"></mat-checkbox><label for="vtop">Hot Deal</label></div>
                    <div class="flex items-center"><mat-checkbox [(ngModel)]="vnew" name="vnew" class="mr-2"></mat-checkbox><label for="vnew">New Product</label></div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold text-gray-800 border-b pb-3 mb-6 flex items-center">
              <span class="text-indigo-600 mr-3">3</span> Image Upload
            </h2>
            <div class="grid grid-cols-2 gap-4">
              <label class="relative w-full h-32 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer hover:bg-gray-100 transition-colors">
                  <input type="file" class="hidden" (change)="onFileSelected($event, 1)">
                  <img *ngIf="preview" [src]="preview" class="absolute w-full h-full object-contain p-1">
                  <div *ngIf="!preview" class="text-center text-gray-400"><mat-icon>add_a_photo</mat-icon><p class="text-xs mt-1">Image 1</p></div>
              </label>
              <label class="relative w-full h-32 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer hover:bg-gray-100 transition-colors">
                  <input type="file" class="hidden" (change)="onFileSelected($event, 2)">
                  <img *ngIf="preview2" [src]="preview2" class="absolute w-full h-full object-contain p-1">
                  <div *ngIf="!preview2" class="text-center text-gray-400"><mat-icon>add_a_photo</mat-icon><p class="text-xs mt-1">Image 2</p></div>
              </label>
              </div>
               <div class="grid grid-cols-2 gap-4">
              <label class="relative w-full h-32 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer hover:bg-gray-100 transition-colors">
                  <input type="file" class="hidden" (change)="onFileSelected($event, 3)">
                  <img *ngIf="preview3" [src]="preview3" class="absolute w-full h-full object-contain p-1">
                  <div *ngIf="!preview3" class="text-center text-gray-400"><mat-icon>add_a_photo</mat-icon><p class="text-xs mt-1">Image 1</p></div>
              </label>
              <label class="relative w-full h-32 flex items-center justify-center border-2 border-dashed rounded-lg cursor-pointer hover:bg-gray-100 transition-colors">
                  <input type="file" class="hidden" (change)="onFileSelected($event, 4)">
                  <img *ngIf="preview4" [src]="preview4" class="absolute w-full h-full object-contain p-1">
                  <div *ngIf="!preview4" class="text-center text-gray-400"><mat-icon>add_a_photo</mat-icon><p class="text-xs mt-1">Image 2</p></div>
              </label>
              </div>
        </div>
      </div>

    </div>

    <div class="mt-8 pt-6 border-t border-gray-200 flex justify-end space-x-3">
        <button mat-stroked-button color="warn" type="button" (click)="closeDialog()" class="!px-6 !py-2.5">
            Cancel
        </button>
        <button mat-flat-button color="primary" type="submit" [disabled]="quoteForm.invalid" class="!px-8 !py-2.5">
            <mat-icon class="mr-2">save</mat-icon>
            Submit Request
        </button>
    </div>
  </form>
</div>
</div>
